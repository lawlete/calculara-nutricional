        const fatCalories = targetFatG * 9;

          : 0;

          const itemP = +(food.p * ratio).toFixed(1);
          const itemC = +(food.c * ratio).toFixed(1);

          c += itemC;
          f += itemF;
          if (byMeal[entry.meal] !== undefined) {

          return { ...entry, food, itemCal, itemP, itemC, itemF };

                                      <div className="flex items-center gap-1 shrink-0">
                                        <button type="button" onClick={() => { handleAddFoodToMeal(section.id, food.id, food.baseAmount); setMealCardSearch(prev => ({ ...prev, [section.id]: '' })); }} className="px-2 py-1 rounded bg-emerald-500/20 text-emerald-300 font-semibold text-[10px]">+ Sumar</button>
                                        <button type="button" onClick={() => { handleReplaceMainInMeal(section.id, food.id, food.baseAmount); setMealCardSearch(prev => ({ ...prev, [section.id]: '' })); }} className="px-2 py-1 rounded bg-blue-500/20 text-blue-300 font-semibold text-[10px]">🔄 Reemplazar</button>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}

                              <div className="flex flex-wrap items-center justify-between gap-2 pt-0.5">
                                <div className="flex items-center gap-1.5 flex-1">
                                  <Repeat className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                                  <select
                                    onChange={(e) => {
                                      const idx = parseInt(e.target.value);
                                      if (!isNaN(idx) && swapOptions[idx]) {
                                        handleSwapSingleMeal(section.id, swapOptions[idx].items, swapOptions[idx].label);
                                      }
                                      e.target.value = "";
                                    }}
                                    defaultValue=""
                                    className="w-full bg-transparent text-[11px] text-slate-300 focus:outline-none cursor-pointer"
                                  >
                                    <option value="" disabled className="bg-slate-900">Cambiar plato completo de {section.shortLabel}...</option>
                                    {swapOptions.map((opt, i) => (
                                      <option key={i} value={i} className="bg-slate-900 text-slate-200">{opt.label}</option>
                                    ))}
                                  </select>
                                </div>

                                <div className="flex items-center gap-1 text-[10px]">
                                  <button onClick={() => handleScaleSingleMeal(section.id, 0.85)} className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">-15%</button>
                                  <button onClick={() => handleScaleSingleMeal(section.id, 1.15)} className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">+15%</button>
                                </div>
                              </div>
                            </div>

                            <div className="space-y-2.5">
                              {sectionItems.map((entry) => (
                                <div key={entry.uid} className="bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                  <div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                      <span className="text-xs sm:text-sm font-semibold text-slate-100">{entry.food.name}</span>
                                      {entry.food.airFryer && (
                                        <span className="px-2 py-0.5 rounded text-[10px] font-medium bg-rose-500/15 text-rose-300 border border-rose-500/30">
                                          🔥 {entry.food.tag}
                                        </span>
                                      )}
                                    </div>
                                    <div className="text-[11px] text-slate-400 flex items-center gap-3 mt-0.5">
                                      <span className="text-blue-400">Prot: {entry.itemP}g</span>
                                      <span className="text-emerald-400">Carbs: {entry.itemC}g</span>
                                      <span className="text-amber-400">Grasas: {entry.itemF}g</span>
                                    </div>
                                    {entry.food.airFryerTip && (
                                      <p className="text-[10px] text-rose-300/80 pt-0.5">
                                        🔥 {entry.food.airFryerTip}
                                      </p>
                                    )}
                                  </div>

                                  <div className="flex items-center justify-between sm:justify-end gap-3">
                                    <div className="flex items-center gap-1.5 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1">
                                      <input
                                        type="number"
                                        min="0"
                                        step={entry.food.unit.includes('g') ? "10" : "0.5"}
                                        value={entry.amount}
                                        onChange={(e) => handleUpdateAmount(entry.uid, e.target.value)}
                                        className="w-14 bg-transparent text-xs font-bold text-center text-white focus:outline-none"
                                      />
                                      <span className="text-[10px] text-slate-400">{entry.food.unit}</span>
                                    </div>
                                    <span className="text-xs font-bold text-slate-200 min-w-[60px] text-right">{entry.itemCal} kcal</span>
                                    <button onClick={() => handleRemoveItem(entry.uid)} className="p-1.5 text-slate-500 hover:text-rose-400 rounded-lg">
                                      <Trash2 className="w-4 h-4" />
                                    </button>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>
              </>
            )}

            {/* MODAL PARA AGREGAR ALIMENTO PERSONALIZADO */}
            {showCustomFoodModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 className="text-base font-bold text-white">Crear Alimento Personalizado (Apto)</h3>
                    <button onClick={() => setShowCustomFoodModal(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                  </div>

                  <form onSubmit={handleCreateCustomFood} className="space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-300 mb-1">Nombre del Alimento o Corte</label>
                      <input type="text" required placeholder="Ej: Pollo al Limón en Tiras" value={newCustomFood.name} onChange={(e) => setNewCustomFood({...newCustomFood, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-slate-300 mb-1">Porción de Referencia</label>
                        <input type="number" required value={newCustomFood.baseAmount} onChange={(e) => setNewCustomFood({...newCustomFood, baseAmount: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                      </div>
                      <div>
                        <label className="block text-slate-300 mb-1">Unidad (g, ml, unid)</label>
                        <input type="text" required value={newCustomFood.unit} onChange={(e) => setNewCustomFood({...newCustomFood, unit: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                      </div>
                    </div>

                    <div className="grid grid-cols-4 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1">Kcal</label>
                        <input type="number" required value={newCustomFood.cal} onChange={(e) => setNewCustomFood({...newCustomFood, cal: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-white" />
                      </div>
                      <div>
                        <label className="block text-blue-400 mb-1">Prot (g)</label>
                        <input type="number" step="0.1" required value={newCustomFood.p} onChange={(e) => setNewCustomFood({...newCustomFood, p: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-white" />
                      </div>
                      <div>
                        <label className="block text-emerald-400 mb-1">Carbs (g)</label>
                        <input type="number" step="0.1" required value={newCustomFood.c} onChange={(e) => setNewCustomFood({...newCustomFood, c: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-white" />
                      </div>
                      <div>
                        <label className="block text-amber-400 mb-1">Grasa (g)</label>
                        <input type="number" step="0.1" required value={newCustomFood.f} onChange={(e) => setNewCustomFood({...newCustomFood, f: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-white" />
                      </div>
                    </div>

                    <label className="flex items-center gap-2 pt-2 cursor-pointer text-slate-300">
                      <input type="checkbox" checked={newCustomFood.airFryer} onChange={(e) => setNewCustomFood({...newCustomFood, airFryer: e.target.checked})} className="rounded accent-emerald-500" />
                      <span>Ideal para cocción en Freidora de Aire (Air Fryer)</span>
                    </label>

                    <div className="flex justify-end gap-2 pt-4">
                      <button type="button" onClick={() => setShowCustomFoodModal(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">Cancelar</button>
                      <button type="submit" className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold">Guardar Alimento</button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
